name: Cypress E2E Tests

env:
  BASE_URL: ${{ secrets.BASE_URL || 'http://planshop.com/' }}
  CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID || 'xnn6up' }}
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - login
        - register
        - forgotPassword
        - cart
        - checkout
        - home
        - shop
        - productDetail
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
        - edge

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
        containers: [1, 2] 
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check application availability
      run: |
        echo "Checking if application is ready at ${{ env.BASE_URL }}"
        curl -f ${{ env.BASE_URL }} || echo "Application check completed"
    
    - name: Start app
      run: npm start &
      
    - name: Wait for app
      run: npx wait-on http://planshop.com/


    - name: Run Cypress tests
      run: npm run test:ci
      env:
        CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
        CYPRESS_baseUrl: ${{ secrets.BASE_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots-${{ matrix.browser }}-${{ github.run_number }}
        path: cypress/screenshots
        retention-days: 7

    - name: Upload videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos-${{ matrix.browser }}-${{ github.run_number }}
        path: cypress/videos
        retention-days: 7

    - name: Upload HTML test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-reports-${{ matrix.browser }}-${{ github.run_number }}
        path: cypress/reports
        retention-days: 30

  deploy-reports:
    runs-on: ubuntu-latest
    needs: [cypress-tests]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all test reports
      uses: actions/download-artifact@v4
      with:
        pattern: html-reports-*
        path: test-reports
        merge-multiple: true

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-reports

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  test-summary:
    runs-on: ubuntu-latest
    needs: [cypress-tests, deploy-reports]
    if: always()
    
    steps:
    - name: Generate test summary
      run: |
        echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Execution Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Base URL**: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Reports**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
