name: CI - Cypress Tests

env:
  BASE_URL: ${{ secrets.BASE_URL || 'http://localhost' }}
  CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID || 'xnn6up' }}
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - login
        - register
        - forgotPassword
        - cart
        - checkout
        - home
        - shop
        - productDetail
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
        - edge

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress123
          MYSQL_ROOT_PASSWORD: rootpass123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build and start WordPress
      run: |
        docker-compose up -d --build
        # Wait for WordPress to be ready
        sleep 30
        curl -f http://localhost:8080 || exit 1

    - name: Update Cypress baseUrl for CI
      run: |
        sed -i 's/planshop\.com/localhost:8080/g' cypress.config.js

    - name: Check application availability
      run: |
        echo "Checking if WordPress is ready at http://localhost"
        curl -f http://localhost || exit 1

    - name: Run Cypress tests
      uses: cypress-io/github-action@v6
      with:
        browser: ${{ matrix.browser }}
        wait-on: 'http://localhost:8080'
        wait-on-timeout: 120
        record: true
        parallel: true
        group: 'E2E Tests - ${{ matrix.browser }}'
        spec: |
          ${{ 
            github.event.inputs.test_suite == 'login' && 'cypress/e2e/auth/login*.cy.js' ||
            github.event.inputs.test_suite == 'register' && 'cypress/e2e/auth/register*.cy.js' ||
            github.event.inputs.test_suite == 'forgotPassword' && 'cypress/e2e/auth/forgot*.cy.js' ||
            github.event.inputs.test_suite == 'cart' && 'cypress/e2e/cartPage.cy.js' ||
            github.event.inputs.test_suite == 'checkout' && 'cypress/e2e/checkoutPage.cy.js' ||
            github.event.inputs.test_suite == 'home' && 'cypress/e2e/homePage.cy.js' ||
            github.event.inputs.test_suite == 'shop' && 'cypress/e2e/shopPage.cy.js' ||
            github.event.inputs.test_suite == 'productDetail' && 'cypress/e2e/productDetailPage.cy.js' ||
            'cypress/e2e/**/*.cy.js'
          }}
      env:
        CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots-${{ matrix.browser }}-${{ github.run_number }}
        path: cypress/screenshots
        retention-days: 7

    - name: Upload videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos-${{ matrix.browser }}-${{ github.run_number }}
        path: cypress/videos
        retention-days: 7

    - name: Merge mochawesome reports
      if: always()
      run: |
        npx mochawesome-merge cypress/reports/*.json > cypress/reports/merged-report.json
        npx marge cypress/reports/merged-report.json --reportDir cypress/reports --inline --reportFilename index.html
      continue-on-error: true

    - name: Upload HTML test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-reports-${{ matrix.browser }}-${{ github.run_number }}
        path: |
          cypress/reports/*.html
          cypress/reports/*.json
          cypress/reports/assets/
        retention-days: 30

  deploy-reports:
    runs-on: ubuntu-latest
    needs: [cypress-tests]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all test reports
      uses: actions/download-artifact@v4
      with:
        pattern: html-reports-*
        path: test-reports
        merge-multiple: true

    - name: Create reports index page
      run: |
        mkdir -p test-reports
        cat > test-reports/index.html << 'EOF'
        
        
            
                
                    🧪 Cypress Test Reports

                    PlanShop E-commerce Testing Dashboard

                    Build: #${{ github.run_number }} | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}

                

                
                
                    
                        ${{ github.run_number }}

                        Build Number

                    

                    
                        2

                        Browsers Tested

                    

                    
                        Latest

                        Report Status

                    

                

                
                
                     Available Reports

                    
                    
                        Complete Test Report
                        
                            Chrome
                            Firefox
                            Merged results from all browsers
                        

                    

                    
                    
                        Cypress Cloud Dashboard
                        
                            Real-time test analytics, video recordings, and detailed logs
                        

                    

                

                
                
                    Generated by GitHub Actions | View Repository

                    Last updated: $(date)

                

            

        
        EOF

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: test-reports

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  test-summary:
    runs-on: ubuntu-latest
    needs: [cypress-tests, deploy-reports]
    if: always()
    
    steps:
    - name: Generate test summary
      run: |
        echo "# Cypress Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Execution Overview" >> $GITHUB_STEP_SUMMARY
        echo "- ** Target URL**: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "- ** Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- ** Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- ** Build**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- ** Node.js**: 20.x" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Quick Access Links" >> $GITHUB_STEP_SUMMARY
        echo "- ** HTML Reports**: [View Test Reports](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY
        echo "- ** Cypress Cloud**: [Live Dashboard](https://cloud.cypress.io/projects/xnn6up)" >> $GITHUB_STEP_SUMMARY
        echo "- ** Test Artifacts**: Available in workflow artifacts section" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "##  Test Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Browsers**: Chrome, Firefox" >> $GITHUB_STEP_SUMMARY
        echo "- **Parallel Execution**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Video Recording**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Screenshots on Failure**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **Retries**: 2 attempts per test" >> $GITHUB_STEP_SUMMARY