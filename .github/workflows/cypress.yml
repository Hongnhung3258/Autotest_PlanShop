name: Cypress E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - login
        - register
        - cart
        - checkout
        - shop
        - home
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
        - edge

env:
  # Application URLs
  BASE_URL: ${{ secrets.BASE_URL || 'https://your-app-url.com' }}
  
  # Test configuration
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
  
  # Database/API credentials (if needed)
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # Job to check code quality and dependencies
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: true

    - name: Security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

  # Main Cypress testing job
  cypress-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        containers: [1, 2, 3] # Parallel execution
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Wait for application to be ready
      run: |
        echo "Checking if application is ready at $BASE_URL"
        npx wait-on $BASE_URL --timeout 300000

    - name: Run Cypress tests
      uses: cypress-io/github-action@v6
      with:
        browser: ${{ matrix.browser }}
        record: true
        parallel: true
        group: 'E2E Tests - ${{ matrix.browser }}'
        spec: |
          ${{ 
            github.event.inputs.test_suite == 'login' && 'cypress/e2e/auth/login.cy.js' ||
            github.event.inputs.test_suite == 'register' && 'cypress/e2e/auth/register.cy.js' ||
            github.event.inputs.test_suite == 'cart' && 'cypress/e2e/cartPage.cy.js' ||
            github.event.inputs.test_suite == 'checkout' && 'cypress/e2e/checkoutPage.cy.js' ||
            github.event.inputs.test_suite == 'shop' && 'cypress/e2e/shopPage.cy.js' ||
            github.event.inputs.test_suite == 'home' && 'cypress/e2e/homePage.cy.js' ||
            'cypress/e2e/**/*.cy.js'
          }}
      env:
        CYPRESS_RECORD_KEY: ${{ env.CYPRESS_RECORD_KEY }}
        CYPRESS_PROJECT_ID: ${{ env.CYPRESS_PROJECT_ID }}
        CYPRESS_baseUrl: ${{ env.BASE_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots-${{ matrix.browser }}-${{ matrix.containers }}
        path: cypress/screenshots
        retention-days: 7

    - name: Upload videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos-${{ matrix.browser }}-${{ matrix.containers }}
        path: cypress/videos
        retention-days: 7

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ matrix.browser }}-${{ matrix.containers }}
        path: |
          cypress/reports
          mochawesome-report
        retention-days: 30

  # Job for smoke tests on different environments
  smoke-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: cypress-tests
    strategy:
      matrix:
        environment: [staging, production]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run smoke tests
      run: |
        # Run key tests that verify core functionality
        npx cypress run \
          --spec "cypress/e2e/auth/login.cy.js,cypress/e2e/homePage.cy.js,cypress/e2e/shopPage.cy.js" \
          --config baseUrl=${{ secrets[format('{0}_URL', matrix.environment)] || env.BASE_URL }} \
          --browser chrome \
          --reporter mochawesome \
          --reporter-options "reportDir=smoke-reports,overwrite=false,html=true,json=true"
      continue-on-error: true

    - name: Upload smoke test results  
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-test-results-${{ matrix.environment }}
        path: smoke-reports/**/*
        retention-days: 30

  # Performance testing job
  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Generate and publish test reports
  test-report:
    runs-on: ubuntu-latest
    needs: [cypress-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all test artifacts
      uses: actions/download-artifact@v4
      with:
        path: test-results

    - name: Generate test summary report
      run: |
        echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Execution Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count test results (this would need to be customized based on actual report format)
        if [ -d "test-results" ]; then
          echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          find test-results -name "*.json" -o -name "*.xml" -o -name "*.html" | head -10 | while read file; do
            echo "- $file" >> $GITHUB_STEP_SUMMARY
          done
        fi

    - name: Deploy test results to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-results
        destination_dir: test-reports/${{ github.run_number }}

  # Slack notification for test results
  notify:
    runs-on: ubuntu-latest
    needs: [cypress-tests, smoke-tests]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
    
    steps:
    - name: Notify Slack on Success
      if: needs.cypress-tests.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '✅ Cypress tests passed successfully!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: needs.cypress-tests.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ Cypress tests failed! Check the details in GitHub Actions.'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}